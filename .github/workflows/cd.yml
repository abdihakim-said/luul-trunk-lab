# CD = "every commit on main (trunk) is built ONCE and promoted dev -> staging -> prod".
# The same image (tagged with the commit SHA) goes to every environment.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deployment at a time; never cancel a deploy half-way
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write   # needed to push to GitHub Container Registry (ghcr.io)

jobs:
  build:
    name: Test, build & push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test

      - id: meta
        name: Image name (ghcr.io/<owner>/<repo>:<sha>)
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: GIT_SHA=${{ github.sha }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh dev ${{ needs.build.outputs.image }}

  deploy-staging:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh staging ${{ needs.build.outputs.image }}

  deploy-prod:
    # In repo Settings -> Environments -> prod, add "Required reviewers".
    # The pipeline then PAUSES here until a person approves.
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/deploy.sh prod ${{ needs.build.outputs.image }}
