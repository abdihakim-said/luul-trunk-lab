# CI = "is this change safe to merge into main (the trunk)?"
# Runs on every pull request. Branch protection makes these checks REQUIRED,
# so nobody can merge broken code into trunk.
name: CI

on:
  pull_request:
    branches: [main]

# If you push again to the same PR, cancel the old run (saves runner minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make test

  build:
    name: Docker build & smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t trunk-based-cicd-reference:ci .
      - name: Smoke test
        run: ./scripts/smoke-test.sh trunk-based-cicd-reference:ci

  branch-age:
    # Trunk-based rule: branches must be SHORT-lived. Warn if a PR branch is old.
    name: Short-lived branch check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn if branch is older than 2 days
        run: |
          first=$(git log --reverse --format=%ct origin/main..HEAD | head -1)
          [ -z "$first" ] && exit 0
          age_hours=$(( ( $(date +%s) - first ) / 3600 ))
          echo "Branch age: ${age_hours}h"
          if [ "$age_hours" -gt 48 ]; then
            echo "::warning::This branch is ${age_hours}h old. In trunk-based development, merge within 1-2 days (use a feature flag if the feature is not finished)."
          fi
